<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Cricket AI Image Generator</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg,
        #0f5132,
        #198754);
      padding: 20px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,.4);
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 8px;
      color: #d9ffe7;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .card {
      background: #162033;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    #result {
      display: none;
      margin-top: 30px;
    }

    .image-box {
      min-height: 350px;
      border-radius: 18px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;

      background:
        radial-gradient(circle at top,
          #22c55e,
          #064e3b 45%,
          #020617 100%);

      border: 2px solid #22c55e;
    }

    .emoji {
      font-size: 100px;
      margin-bottom: 15px;
    }

    .player-name {
      font-size: 32px;
      font-weight: bold;
    }

    .team {
      margin-top: 10px;
      font-size: 20px;
      color: #d1fae5;
    }

    .style {
      margin-top: 15px;
      background: rgba(255,255,255,.15);
      padding: 10px 18px;
      border-radius: 30px;
    }

    .note {
      margin-top: 15px;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #94a3b8;
    }

  </style>

</head>

<body>

<header>

  <h1>🏏 Cricket AI Image Generator</h1>

  <p>Create amazing cricket artwork with AI</p>

</header>


<div class="container">

  <div class="card">

    <label>Player Name</label>

    <input
      type="text"
      id="player"
      placeholder="Enter player name"
    >


    <label>Team</label>

    <input
      type="text"
      id="team"
      placeholder="Example: India"
    >


    <label>Image Style</label>

    <select id="style">

      <option>Realistic</option>

      <option>Digital Art</option>

      <option>Anime</option>

      <option>Poster Style</option>

      <option>Cyberpunk</option>

    </select>


    <button onclick="generateImage()">

      ✨ Generate Cricket Image

    </button>


    <div id="result">

      <div class="image-box">

        <div class="emoji">
          🏏
        </div>

        <div
          class="player-name"
          id="resultPlayer">

          Cricket Player

        </div>

        <div
          class="team"
          id="resultTeam">

          Team

        </div>

        <div
          class="style"
          id="resultStyle">

          Realistic

        </div>

      </div>


      <p class="note">

        ✨ AI Cricket Artwork Preview

      </p>

    </div>

  </div>

</div>


<footer>

  © 2026 Cricket AI Image Generator

</footer>


<script>

function generateImage() {

  let player =
    document.getElementById("player").value;

  let team =
    document.getElementById("team").value;

  let style =
    document.getElementById("style").value;


  if (player === "") {

    player = "Cricket Player";

  }


  if (team === "") {

    team = "International Team";

  }


  document.getElementById(
    "resultPlayer"
  ).innerText = player;


  document.getElementById(
    "resultTeam"
  ).innerText = team;


  document.getElementById(
    "resultStyle"
  ).innerText = style;


  document.getElementById(
    "result"
  ).style.display = "block";

}

</script>

</body>
  </html>
