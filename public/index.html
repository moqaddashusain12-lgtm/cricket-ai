<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cricket AI Image Generator</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
}

header {
  padding: 25px 15px;
  text-align: center;
  background: linear-gradient(135deg, #0b57d0, #174ea6);
  color: white;
}

header h1 { margin: 0; font-size: 28px; }
header p { margin: 8px 0 0; }

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px 15px;
}

.generator, .news-card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,.1);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
}

input, select { border: 1px solid #ccc; }

button {
  margin-top: 20px;
  border: none;
  background: #0b57d0;
  color: white;
  font-weight: bold;
}

button:disabled { opacity: .6; }

#result {
  margin-top: 20px;
  text-align: center;
}

#result img {
  width: 100%;
  max-width: 512px;
  border-radius: 15px;
}

.news-title { margin-top: 35px; }

.news-card { margin-top: 12px; }

.news-card h3 {
  margin-top: 0;
  line-height: 1.5;
}

.news-card a {
  color: #0b57d0;
  font-weight: bold;
  text-decoration: none;
}

footer {
  text-align: center;
  padding: 25px;
  color: #666;
}
</style>
</head>

<body>

<header>
  <h1>🏏 Cricket AI Image Generator</h1>
  <p>AI से अपना Cricket Player बनाएं</p>
</header>

<div class="container">

<div class="generator">

<label>Player Name</label>
<input id="player" placeholder="जैसे Virat Kohli">

<label>Team</label>
<input id="team" placeholder="जैसे India">

<label>Image Style</label>
<select id="style">
  <option value="Realistic">Realistic</option>
  <option value="Cinematic">Cinematic</option>
  <option value="Digital Art">Digital Art</option>
  <option value="Cartoon">Cartoon</option>
</select>

<button id="generateBtn">
✨ Generate Cricket Image
</button>

<div id="result"></div>

</div>


<h2 class="news-title">📰 Latest Cricket News</h2>

<div id="news">
<p>Loading latest cricket news...</p>
</div>

</div>

<footer>
🏏 Cricket AI Generator
</footer>


<script>

const generateBtn = document.getElementById("generateBtn");
const result = document.getElementById("result");


generateBtn.addEventListener("click", async () => {

  const player = document.getElementById("player").value.trim();
  const team = document.getElementById("team").value.trim();
  const style = document.getElementById("style").value;

  if (!player || !team) {
    alert("Player Name और Team भरें");
    return;
  }

  generateBtn.disabled = true;
  generateBtn.innerText = "⏳ AI Image Generating...";

  result.innerHTML =
    "<p>🏏 AI Image बनाई जा रही है, कृपया इंतजार करें...</p>";

  try {

    const response = await fetch(
      "/api/generate-image",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          player: player,
          team: team,
          style: style
        })
      }
    );

    if (!response.ok) {

      const errorText = await response.text();

      throw new Error(
        errorText || "Image generate नहीं हुई"
      );
    }

    const imageBlob = await response.blob();

    const imageUrl =
      URL.createObjectURL(imageBlob);

    result.innerHTML = `
      <h2>🎨 Generated Cricket Image</h2>
      <img
        src="${imageUrl}"
        alt="Generated Cricket Player"
      >
    `;

  } catch (error) {

    result.innerHTML = `
      <p>
        ❌ Image generate नहीं हुई।
      </p>
      <small>${error.message}</small>
    `;

  }

  generateBtn.disabled = false;
  generateBtn.innerText =
    "✨ Generate Cricket Image";

});


// Latest Cricket News

async function loadNews() {

  const newsDiv =
    document.getElementById("news");

  try {

    const response =
      await fetch("/api/news");

    const data =
      await response.json();

    if (
      !data.success ||
      !data.news
    ) {
      throw new Error(
        data.error || "News नहीं मिली"
      );
    }

    newsDiv.innerHTML = "";

    data.news.forEach((item) => {

      const card =
        document.createElement("div");

      card.className =
        "news-card";

      const title =
        document.createElement("h3");

      title.textContent =
        item.title;

      const link =
        document.createElement("a");

      link.href =
        item.link;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";

      link.textContent =
        "पूरी खबर पढ़ें →";

      card.appendChild(title);
      card.appendChild(link);

      newsDiv.appendChild(card);

    });

  } catch (error) {

    newsDiv.innerHTML =
      "<p>⚠️ News load नहीं हो सकी।</p>";

  }

}

loadNews();

</script>

</body>
</html>
