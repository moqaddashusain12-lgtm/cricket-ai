<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cricket AI Image Generator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
}

header {
  padding: 30px 15px;
  text-align: center;
  background: linear-gradient(135deg, #0b57d0, #174ea6);
  color: white;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px 15px;
}

.generator {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,.1);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
}

input,
select {
  border: 1px solid #ccc;
}

button {
  margin-top: 20px;
  border: none;
  background: #0b57d0;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#result {
  margin-top: 25px;
  text-align: center;
}

#result img {
  width: 100%;
  max-width: 512px;
  border-radius: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,.15);
}

.error {
  color: #c62828;
}

.news-title {
  margin-top: 35px;
}

.news-card {
  background: white;
  padding: 16px;
  border-radius: 12px;
  margin-top: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.news-card h3 {
  margin-top: 0;
  line-height: 1.5;
}

.news-card a {
  color: #0b57d0;
  font-weight: bold;
  text-decoration: none;
}

footer {
  text-align: center;
  padding: 30px;
  color: #666;
}
</style>
</head>

<body>

<header>
  <h1>🏏 Cricket AI Image Generator</h1>
  <p>AI से अपना Cricket Player बनाएं</p>
</header>


<div class="container">

  <div class="generator">

    <label>Player Name</label>

    <input
      type="text"
      id="player"
      placeholder="जैसे Virat Kohli"
    >


    <label>Team</label>

    <input
      type="text"
      id="team"
      placeholder="जैसे India"
    >


    <label>Image Style</label>

    <select id="style">

      <option value="Realistic">
        Realistic
      </option>

      <option value="Cinematic">
        Cinematic
      </option>

      <option value="Digital Art">
        Digital Art
      </option>

      <option value="Cartoon">
        Cartoon
      </option>

    </select>


    <button id="generateBtn">
      ✨ Generate Cricket Image
    </button>


    <div id="result"></div>

  </div>


  <h2 class="news-title">
    📰 Latest Cricket News
  </h2>


  <div id="news">
    <p>⏳ Latest Cricket News loading...</p>
  </div>


</div>


<footer>
  🏏 Cricket AI Generator
</footer>


<script>

const generateBtn =
  document.getElementById("generateBtn");

const result =
  document.getElementById("result");


// =========================
// AI IMAGE GENERATION
// =========================

generateBtn.addEventListener(
  "click",
  async function () {

    const player =
      document
        .getElementById("player")
        .value
        .trim();


    const team =
      document
        .getElementById("team")
        .value
        .trim();


    const style =
      document
        .getElementById("style")
        .value;


    if (!player || !team) {

      alert(
        "कृपया Player Name और Team भरें"
      );

      return;

    }


    generateBtn.disabled = true;

    generateBtn.innerText =
      "⏳ AI Image बनाई जा रही है...";


    result.innerHTML =
      "<p>🏏 कृपया इंतजार करें...</p>";


    try {

      const response =
        await fetch(
          "/api/generate-image",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                player: player,
                team: team,
                style: style
              })

          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.error ||
          "Image generate नहीं हुई"
        );

      }


      if (!data.image) {

        throw new Error(
          "Image data नहीं मिली"
        );

      }


      result.innerHTML = "";


      const heading =
        document.createElement("h2");

      heading.textContent =
        "🎨 Generated Cricket Image";


      const image =
        document.createElement("img");

      image.src =
        data.image;

      image.alt =
        "Generated Cricket Player";


      result.appendChild(heading);

      result.appendChild(image);


    } catch (error) {

      result.innerHTML =
        "<p class='error'>❌ " +
        error.message +
        "</p>";

    }


    generateBtn.disabled = false;

    generateBtn.innerText =
      "✨ Generate Cricket Image";

  }
);


// =========================
// LATEST CRICKET NEWS
// =========================

async function loadNews() {

  const newsDiv =
    document.getElementById("news");


  try {

    const response =
      await fetch("/api/news");


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "News load नहीं हुई"
      );

    }


    if (
      !data.news ||
      data.news.length === 0
    ) {

      throw new Error(
        "कोई News उपलब्ध नहीं है"
      );

    }


    newsDiv.innerHTML = "";


    data.news.forEach(
      function (item) {

        const card =
          document.createElement("div");

        card.className =
          "news-card";


        const title =
          document.createElement("h3");

        title.textContent =
          item.title;


        const link =
          document.createElement("a");

        link.href =
          item.link;

        link.target =
          "_blank";

        link.rel =
          "noopener noreferrer";

        link.textContent =
          "पूरी खबर पढ़ें →";


        card.appendChild(title);

        card.appendChild(link);


        newsDiv.appendChild(card);

      }
    );


  } catch (error) {

    newsDiv.innerHTML =
      "<p class='error'>⚠️ " +
      error.message +
      "</p>";

  }

}


// Website खुलते ही News load करें

loadNews();

</script>

</body>
</html>
