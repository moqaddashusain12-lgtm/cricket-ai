<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cricket AI Image Generator</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
}

header {
  padding: 30px 15px;
  text-align: center;
  background: linear-gradient(135deg, #0b57d0, #174ea6);
  color: white;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 8px 0 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px 15px;
}

.generator {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,.1);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
}

input,
select {
  border: 1px solid #ccc;
}

button {
  margin-top: 20px;
  border: none;
  background: #0b57d0;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#result {
  margin-top: 25px;
  text-align: center;
}

#result img {
  width: 100%;
  max-width: 512px;
  border-radius: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,.15);
}

.download-btn {
  display: none;
  margin-top: 15px;
  background: #16a34a;
}

.error {
  color: #c62828;
  font-weight: bold;
}

.news-title {
  margin-top: 35px;
}

.news-card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-top: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.news-card a {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 14px;
  background: #0b57d0;
  color: white;
  text-decoration: none;
  border-radius: 8px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #666;
}

</style>

</head>


<body>


<header>

<h1>🏏 Cricket AI Image Generator</h1>

<p>AI से अपना Cricket Player बनाएं</p>

</header>



<div class="container">


<div class="generator">


<label>Player Name</label>

<input
type="text"
id="player"
placeholder="जैसे Virat Kohli"
>


<label>Team</label>

<input
type="text"
id="team"
placeholder="जैसे India"
>


<label>Image Style</label>

<select id="style">

<option value="Realistic">
Realistic
</option>

<option value="Cinematic">
Cinematic
</option>

<option value="Digital Art">
Digital Art
</option>

<option value="Cartoon">
Cartoon
</option>

</select>



<button id="generateBtn">

✨ Generate Cricket Image

</button>



<div id="result"></div>



<button
id="downloadBtn"
class="download-btn"
>

⬇️ Download Image

</button>


</div>



<h2 class="news-title">

📰 Cricket News

</h2>


<div class="news-card">

<h3>
🏏 Latest Cricket News
</h3>

<p>
ताज़ा क्रिकेट समाचार देखने के लिए Cricinfo पर जाएँ।
</p>

<a
href="https://www.cricinfo.com/"
target="_blank"
rel="noopener noreferrer"
>

Cricinfo News →

</a>

</div>



<div class="news-card">

<h3>
🏆 Official Cricket Updates
</h3>

<p>
International Cricket और official updates देखें।
</p>

<a
href="https://www.icc-cricket.com/"
target="_blank"
rel="noopener noreferrer"
>

ICC Cricket →

</a>

</div>


</div>



<footer>

🏏 Cricket AI Generator

</footer>



<script>


const generateBtn =
document.getElementById("generateBtn");


const result =
document.getElementById("result");


const downloadBtn =
document.getElementById("downloadBtn");



let generatedImageURL = null;

let generatedPlayerName =
"cricket-player";



generateBtn.addEventListener(

"click",

async function () {


const player =
document
.getElementById("player")
.value
.trim();


const team =
document
.getElementById("team")
.value
.trim();


const style =
document
.getElementById("style")
.value;



if (!player || !team) {

alert(
"कृपया Player Name और Team भरें"
);

return;

}



generateBtn.disabled =
true;


generateBtn.innerText =
"⏳ AI Image बनाई जा रही है...";


result.innerHTML =
"<p>🏏 कृपया इंतजार करें...</p>";


downloadBtn.style.display =
"none";



try {


const response =
await fetch(

"/api/generate-image",

{

method: "POST",

headers: {

"Content-Type":
"application/json"

},

body:

JSON.stringify({

player: player,

team: team,

style: style

})

}

);



// अगर API error है

if (!response.ok) {


const errorText =
await response.text();


throw new Error(
errorText
);

}



// सीधे Image Blob लें

const imageBlob =
await response.blob();



// Image URL बनाएं

const imageURL =
URL.createObjectURL(
imageBlob
);


generatedImageURL =
imageURL;


generatedPlayerName =
player;



result.innerHTML =
"";



const heading =
document.createElement("h2");


heading.textContent =
"🎨 Generated Cricket Image";



const image =
document.createElement("img");


image.src =
imageURL;


image.alt =
"Generated Cricket Player";



result.appendChild(
heading
);


result.appendChild(
image
);



// Download Button दिखाएं

downloadBtn.style.display =
"block";


}


catch (error) {


result.innerHTML =

"<p class='error'>❌ Error: " +

error.message +

"</p>";


}


finally {


generateBtn.disabled =
false;


generateBtn.innerText =
"✨ Generate Cricket Image";


}


}

);



// =========================
// DOWNLOAD IMAGE
// =========================


downloadBtn.addEventListener(

"click",

function () {


if (!generatedImageURL) {


alert(
"पहले Image Generate करें"
);


return;


}



const link =
document.createElement("a");


link.href =
generatedImageURL;


link.download =

generatedPlayerName

.replace(/\s+/g, "-")

.toLowerCase()

+ "-cricket-ai.jpg";



document.body.appendChild(
link
);


link.click();


document.body.removeChild(
link
);


}

);


</script>


</body>

  </html>
