<script>
/* =========================================================
   CRICKET SHORT — LIVE SCORE ENGINE
   ========================================================= */

let latestMatches = [];
let scoreRefreshTimer = null;

/* ---------- Helpers ---------- */

function safeNumber(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n : null;
}

function formatOvers(overs) {
    if (overs === null || overs === undefined || overs === "") {
        return "";
    }

    return `(${overs} ov)`;
}

function formatScore(score) {
    if (!score) {
        return "—";
    }

    const runs = safeNumber(score.runs);
    const wickets = safeNumber(score.wickets);
    const overs = score.overs;

    if (runs === null) {
        return "—";
    }

    let text = String(runs);

    if (wickets !== null) {
        text += `/${wickets}`;
    }

    if (overs !== null && overs !== undefined && overs !== "") {
        text += ` ${formatOvers(overs)}`;
    }

    return text;
}


/* ---------- Find score belonging to a team ---------- */

function getTeamScore(match, teamName) {

    const scores = Array.isArray(match.score)
        ? match.score
        : [];

    if (!scores.length) {
        return null;
    }

    const wanted = String(teamName || "")
        .trim()
        .toLowerCase();

    /*
      Example innings names:
      "India Inning 1"
      "West Indies Inning 1"
      "India Innings 2"
    */

    let found = scores.find(item => {
        const inning = String(item.inning || "")
            .toLowerCase();

        return inning.includes(wanted);
    });

    return found || null;
}


/* ---------- Run rate ---------- */

function calculateCRR(score) {

    if (!score) {
        return null;
    }

    const runs = safeNumber(score.runs);
    const oversText = score.overs;

    if (
        runs === null ||
        oversText === null ||
        oversText === undefined
    ) {
        return null;
    }

    const parts = String(oversText).split(".");

    const completedOvers = Number(parts[0] || 0);
    const balls = Number(parts[1] || 0);

    if (!Number.isFinite(completedOvers)) {
        return null;
    }

    /*
      Cricket overs are not decimal numbers.
      34.5 means 34 overs + 5 balls.
    */

    const totalBalls =
        (completedOvers * 6) + balls;

    if (totalBalls <= 0) {
        return null;
    }

    const crr =
        (runs / totalBalls) * 6;

    return crr.toFixed(2);
}


/* ---------- ODI/T20 target ---------- */

function getTargetInfo(match, battingScore, bowlingScore) {

    if (!battingScore || !bowlingScore) {
        return null;
    }

    const bowlingRuns = safeNumber(bowlingScore.runs);

    if (bowlingRuns === null) {
        return null;
    }

    const target = bowlingRuns + 1;

    const battingRuns =
        safeNumber(battingScore.runs) || 0;

    const requiredRuns =
        Math.max(target - battingRuns, 0);

    return {
        target,
        requiredRuns
    };
}


/* ---------- Required Run Rate ---------- */

function calculateRRR(
    requiredRuns,
    oversLimit,
    currentOvers
) {

    if (
        requiredRuns === null ||
        requiredRuns <= 0 ||
        !oversLimit
    ) {
        return null;
    }

    const parts = String(currentOvers || "0").split(".");

    const completedOvers =
        Number(parts[0] || 0);

    const balls =
        Number(parts[1] || 0);

    const currentBalls =
        completedOvers * 6 + balls;

    const totalBalls =
        oversLimit * 6;

    const remainingBalls =
        totalBalls - currentBalls;

    if (remainingBalls <= 0) {
        return null;
    }

    const rrr =
        (requiredRuns / remainingBalls) * 6;

    return rrr.toFixed(2);
}


/* ---------- Get overs limit ---------- */

function getOversLimit(match) {

    const type =
        String(match.matchType || "")
            .toUpperCase();

    if (type === "T20") {
        return 20;
    }

    if (type === "ODI") {
        return 50;
    }

    /*
      Test cricket has no fixed limited overs.
    */

    return null;
}


/* ---------- Status ---------- */

function getDisplayStatus(match) {

    const status =
        String(
            match.status ||
            match.statusText ||
            ""
        ).toUpperCase();

    if (status.includes("LIVE")) {
        return "LIVE";
    }

    if (
        status.includes("STUMP") ||
        status.includes("BREAK")
    ) {
        return "STUMPS";
    }

    if (
        status.includes("DELAY") ||
        status.includes("RAIN")
    ) {
        return "DELAYED";
    }

    if (
        status.includes("RESULT") ||
        status.includes("WON") ||
        status.includes("DRAW")
    ) {
        return "RESULT";
    }

    return match.status || "LIVE";
}


/* ---------- Team block ---------- */

function renderTeamBlock(
    match,
    teamName,
    logo,
    extraClass = ""
) {

    const score =
        getTeamScore(match, teamName);

    const scoreText =
        formatScore(score);

    const crr =
        calculateCRR(score);

    return `
        <div class="score-team ${extraClass}">

            <div class="score-team-name">

                ${
                    logo
                    ? `
                        <img
                            src="${logo}"
                            alt="${teamName}"
                            class="score-team-logo"
                            onerror="this.style.display='none'"
                        >
                    `
                    : ""
                }

                <span>${teamName}</span>

            </div>

            <div class="score-team-score">
                ${scoreText}
            </div>

            ${
                crr
                ? `
                    <div class="score-crr">
                        CRR: ${crr}
                    </div>
                `
                : ""
            }

        </div>
    `;
}


/* ---------- Main Score Card ---------- */

function renderScoreCard(match, index) {

    const team1 =
        match.team1 || "Team 1";

    const team2 =
        match.team2 || "Team 2";

    const team1Score =
        getTeamScore(match, team1);

    const team2Score =
        getTeamScore(match, team2);

    const team1CRR =
        calculateCRR(team1Score);

    const team2CRR =
        calculateCRR(team2Score);

    const oversLimit =
        getOversLimit(match);

    let targetHTML = "";

    /*
      If one innings has finished and the other
      innings is batting, calculate target.
    */

    if (team1Score && team2Score) {

        const team1Overs =
            safeNumber(team1Score.overs);

        const team2Overs =
            safeNumber(team2Score.overs);

        /*
          Normally the innings with fewer/current overs
          is the batting innings.
        */

        let battingScore =
            team1Score;

        let bowlingScore =
            team2Score;

        if (
            team1Overs !== null &&
            team2Overs !== null
        ) {
            if (team2Overs < team1Overs) {
                battingScore = team2Score;
                bowlingScore = team1Score;
            }
        }

        const target =
            getTargetInfo(
                match,
                battingScore,
                bowlingScore
            );

        if (target) {

            let rrr = null;

            if (oversLimit) {

                rrr = calculateRRR(
                    target.requiredRuns,
                    oversLimit,
                    battingScore.overs
                );
            }

            targetHTML = `
                <div class="score-extra">

                    <div>
                        🎯 Target:
                        <strong>${target.target}</strong>
                    </div>

                    <div>
                        🏃 Required:
                        <strong>${target.requiredRuns}</strong>
                        runs
                    </div>

                    ${
                        rrr
                        ? `
                            <div>
                                📈 RRR:
                                <strong>${rrr}</strong>
                            </div>
                        `
                        : ""
                    }

                </div>
            `;
        }
    }


    const status =
        getDisplayStatus(match);

    const statusClass =
        status.toLowerCase().replace(/\s+/g, "-");

    const date =
        match.date || "";

    const matchType =
        match.matchType || "CRICKET";

    const venue =
        match.venue || "Venue unavailable";

    const info =
        match.statusText || "";

    return `
        <div class="live-score-card">

            <div class="score-title">
                ${match.name || `${team1} vs ${team2}`}
            </div>

            <div class="score-status ${statusClass}">
                ${status}
            </div>

            <div class="score-teams">

                <div class="score-team">

                    <div class="score-team-name">

                        ${
                            match.team1Logo
                            ? `
                                <img
                                    src="${match.team1Logo}"
                                    class="score-team-logo"
                                    alt="${team1}"
                                    onerror="this.style.display='none'"
                                >
                            `
                            : ""
                        }

                        <span>${team1}</span>

                    </div>

                    <div class="score-team-score">
                        ${
                            formatScore(team1Score)
                        }
                    </div>

                    ${
                        team1CRR
                        ? `
                            <div class="score-crr">
                                CRR: ${team1CRR}
                            </div>
                        `
                        : ""
                    }

                </div>


                <div class="score-vs">
                    VS
                </div>


                <div class="score-team">

                    <div class="score-team-name">

                        ${
                            match.team2Logo
                            ? `
                                <img
                                    src="${match.team2Logo}"
                                    class="score-team-logo"
                                    alt="${team2}"
                                    onerror="this.style.display='none'"
                                >
                            `
                            : ""
                        }

                        <span>${team2}</span>

                    </div>

                    <div class="score-team-score">
                        ${
                            formatScore(team2Score)
                        }
                    </div>

                    ${
                        team2CRR
                        ? `
                            <div class="score-crr">
                                CRR: ${team2CRR}
                            </div>
                        `
                        : ""
                    }

                </div>

            </div>


            ${targetHTML}


            <div class="score-info">

                <div>
                    🏟️ ${venue}
                </div>

                <div>
                    📅 ${date} • ${matchType}
                </div>

                ${
                    info
                    ? `
                        <div>
                            ℹ️ ${info}
                        </div>
                    `
                    : ""
                }

            </div>


            <div class="score-actions">

                <button
                    onclick="shareMatch(${index})"
                >
                    📤 Share
                </button>

                <button
                    onclick="shareScoreImage(${index})"
                >
                    🖼️ 16:9
                </button>

            </div>

        </div>
    `;
}


/* ---------- Render all matches ---------- */

function renderLiveScores(matches) {

    latestMatches =
        Array.isArray(matches)
        ? matches
        : [];

    const container =
        document.getElementById("scoreContainer");

    if (!container) {
        return;
    }

    if (!latestMatches.length) {

        container.innerHTML = `
            <div class="no-score">
                🏏 अभी कोई Live Cricket Match उपलब्ध नहीं है।
            </div>
        `;

        return;
    }

    container.innerHTML =
        latestMatches
            .map((match, index) =>
                renderScoreCard(match, index)
            )
            .join("");
}


/* ---------- Fetch Live Score ---------- */

async function loadLiveScores() {

    const container =
        document.getElementById("scoreContainer");

    if (container) {

        container.innerHTML = `
            <div class="loading-score">
                🔄 Live score loading...
            </div>
        `;
    }

    try {

        const response =
            await fetch("/api/live-score", {
                method: "GET",
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        /*
          Worker response:
          {
            success: true,
            matches: [...]
          }
        */

        const matches =
            Array.isArray(data.matches)
            ? data.matches
            : [];

        renderLiveScores(matches);

        const update =
            document.getElementById(
                "lastUpdated"
            );

        if (update) {

            const now =
                new Date();

            update.textContent =
                `Last updated: ${now.toLocaleTimeString(
                    "en-IN",
                    {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                )} • ${matches.length} matches • Auto refresh: 5 min`;
        }

    } catch (error) {

        console.error(
            "Live score error:",
            error
        );

        if (container) {

            container.innerHTML = `
                <div class="no-score">
                    ❌ Live score load नहीं हो सका।
                    <br>
                    <button
                        onclick="loadLiveScores()"
                    >
                        🔄 Try Again
                    </button>
                </div>
            `;
        }
    }
}


/* ---------- Manual Refresh ---------- */

function refreshScores() {
    loadLiveScores();
}


/* ---------- 5 Minute Auto Refresh ---------- */

function startScoreAutoRefresh() {

    if (scoreRefreshTimer) {
        clearInterval(scoreRefreshTimer);
    }

    scoreRefreshTimer =
        setInterval(() => {

            /*
              Only refresh while Live Score
              section is visible/active.
            */

            const section =
                document.getElementById(
                    "liveScore"
                );

            if (!section) {
                return;
            }

            const rect =
                section.getBoundingClientRect();

            const visible =
                rect.top < window.innerHeight &&
                rect.bottom > 0;

            if (visible) {
                loadLiveScores();
            }

        }, 5 * 60 * 1000);
}


/* ---------- Share Text ---------- */

function buildScoreText(match) {

    const team1 =
        match.team1 || "Team 1";

    const team2 =
        match.team2 || "Team 2";

    const score1 =
        getTeamScore(match, team1);

    const score2 =
        getTeamScore(match, team2);

    const status =
        getDisplayStatus(match);

    let text =
        `🏏 ${match.name || `${team1} vs ${team2}`}\n\n`;

    text +=
        `${team1}: ${formatScore(score1)}\n`;

    text +=
        `${team2}: ${formatScore(score2)}\n\n`;

    text +=
        `🔴 ${status}\n`;

    if (match.venue) {
        text +=
            `🏟️ ${match.venue}\n`;
    }

    if (match.date) {
        text +=
            `📅 ${match.date}`;
    }

    return text;
}


/* ---------- Share Match ---------- */

async function shareMatch(index) {

    const match =
        latestMatches[index];

    if (!match) {
        return;
    }

    const text =
        buildScoreText(match);

    try {

        if (
            navigator.share
        ) {

            await navigator.share({
                title:
                    match.name ||
                    "Cricket Live Score",
                text
            });

        } else {

            await navigator.clipboard.writeText(
                text
            );

            alert(
                "Score copied successfully!"
            );
        }

    } catch (error) {

        console.log(
            "Share cancelled"
        );
    }
}


/* ---------- 16:9 Score Image ---------- */

async function shareScoreImage(index) {

    const match =
        latestMatches[index];

    if (!match) {
        return;
    }

    const team1 =
        match.team1 || "Team 1";

    const team2 =
        match.team2 || "Team 2";

    const score1 =
        formatScore(
            getTeamScore(match, team1)
        );

    const score2 =
        formatScore(
            getTeamScore(match, team2)
        );

    /*
      Use canvas to create a 16:9
      cricket scoreboard image.
    */

    const canvas =
        document.createElement("canvas");

    canvas.width = 1600;
    canvas.height = 900;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "#07111f";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 52px Arial";

    ctx.fillText(
        "🏏 CRICKET SHORT",
        800,
        100
    );

    ctx.font =
        "bold 42px Arial";

    ctx.fillText(
        match.name ||
        `${team1} vs ${team2}`,
        800,
        190
    );

    ctx.font =
        "bold 32px Arial";

    ctx.fillText(
        getDisplayStatus(match),
        800,
        260
    );

    ctx.font =
        "bold 58px Arial";

    ctx.fillText(
        `${team1}    ${score1}`,
        800,
        400
    );

    ctx.fillText(
        `${team2}    ${score2}`,
        800,
        510
    );

    ctx.font =
        "30px Arial";

    ctx.fillText(
        `🏟️ ${match.venue || "Cricket Stadium"}`,
        800,
        650
    );

    ctx.fillText(
        `📅 ${match.date || ""} • ${match.matchType || ""}`,
        800,
        710
    );

    ctx.font =
        "26px Arial";

    ctx.fillText(
        "Real-Time Cricket Scoreboard",
        800,
        820
    );

    canvas.toBlob(async blob => {

        if (!blob) {
            return;
        }

        const file =
            new File(
                [blob],
                "cricket-short-score.png",
                {
                    type: "image/png"
                }
            );

        try {

            if (
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                    files: [file]
                })
            ) {

                await navigator.share({
                    title:
                        match.name ||
                        "Cricket Score",
                    files: [file]
                });

            } else {

                const url =
                    URL.createObjectURL(blob);

                const a =
                    document.createElement("a");

                a.href = url;

                a.download =
                    "cricket-short-score.png";

                a.click();

                URL.revokeObjectURL(url);
            }

        } catch (error) {

            console.log(
                "Image share cancelled"
            );
        }

    }, "image/png");
}


/* ---------- Start ---------- */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadLiveScores();

        startScoreAutoRefresh();

    }
);
</script>
