<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Cricket Short - PRISM Score</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:transparent !important;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

#app{
  width:100%;
  padding:8px;
  display:flex;
  justify-content:center;
}

.scoreboard{
  width:min(900px,100%);
  background:rgba(3,12,22,.86);
  border:1px solid rgba(100,170,220,.65);
  border-radius:14px;
  padding:10px 12px;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:5px;
}

.brand{
  font-size:11px;
  font-weight:800;
  color:#dcefff;
}

.status{
  font-size:10px;
  font-weight:800;
  padding:4px 8px;
  border-radius:20px;
  background:#45515c;
  color:white;
}

.status.live{
  background:#c51f2d;
}

.status.live::before{
  content:"";
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:white;
  margin-right:4px;
}

.match-name{
  text-align:center;
  color:#a9c1d4;
  font-size:10px;
  margin-bottom:7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.teams{
  display:grid;
  grid-template-columns:1fr 42px 1fr;
  align-items:center;
  gap:6px;
}

.team{
  text-align:center;
  min-width:0;
}

.team-name{
  color:white;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score{
  color:white;
  font-size:22px;
  font-weight:900;
  margin-top:3px;
}

.vs{
  text-align:center;
  color:#7891a5;
  font-size:10px;
  font-weight:800;
}

.info{
  text-align:center;
  margin-top:7px;
  color:#a9c0d1;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.updated{
  text-align:right;
  margin-top:4px;
  color:#70899d;
  font-size:8px;
}

.loading,
.error,
.no-match{
  text-align:center;
  color:white;
  font-size:12px;
  padding:14px;
}

.error{
  color:#ffd1d1;
}

@media(max-width:500px){

  #app{
    padding:5px;
  }

  .scoreboard{
    padding:8px 9px;
    border-radius:11px;
  }

  .team-name{
    font-size:11px;
  }

  .score{
    font-size:18px;
  }

  .match-name{
    font-size:9px;
  }

  .info{
    font-size:9px;
  }
}
</style>
</head>

<body>

<div id="app">
  <div class="scoreboard">
    <div class="loading">Loading live score...</div>
  </div>
</div>

<script>

const API_URL = "/api/live-score";

/* 5 MINUTES */
const REFRESH_TIME = 300000;


/* =========================================
   SAFE TEXT
========================================= */

function safe(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================
   CLEAN TEAM NAME
========================================= */

function cleanTeamName(name){

  return String(name || "")
    .toLowerCase()
    .replace(/\b(cricket|team|innings|inning)\b/g,"")
    .replace(/[^a-z0-9]/g,"")
    .trim();
}


/* =========================================
   GET TEAM NAMES
========================================= */

function getTeams(match){

  let team1 =
    match.team1 ||
    match.team1Name ||
    "";

  let team2 =
    match.team2 ||
    match.team2Name ||
    "";


  /*
    Some APIs return teams as array
  */

  if(
    (!team1 || !team2) &&
    Array.isArray(match.teams)
  ){

    team1 =
      team1 ||
      match.teams[0] ||
      "";

    team2 =
      team2 ||
      match.teams[1] ||
      "";
  }


  /*
    Sometimes team names are inside
    a "teamInfo" array.
  */

  if(
    (!team1 || !team2) &&
    Array.isArray(match.teamInfo)
  ){

    if(!team1){
      team1 =
        match.teamInfo[0]?.name ||
        match.teamInfo[0]?.shortname ||
        "";
    }

    if(!team2){
      team2 =
        match.teamInfo[1]?.name ||
        match.teamInfo[1]?.shortname ||
        "";
    }
  }


  /*
    Last fallback: match name
  */

  if(
    (!team1 || !team2) &&
    match.name
  ){

    const parts =
      String(match.name)
        .split(" vs ");


    if(!team1){
      team1 = parts[0] || "Team 1";
    }

    if(!team2){
      team2 = parts[1] || "Team 2";
    }
  }


  return {
    team1: team1 || "Team 1",
    team2: team2 || "Team 2"
  };
}


/* =========================================
   GET OVERS
========================================= */

function getOvers(score){

  if(!score || typeof score !== "object"){
    return "";
  }


  const values = [

    score.o,

    score.overs,

    score.over,

    score.overCount,

    score.oversCount

  ];


  for(const value of values){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return String(value)
        .replace(/[()]/g,"")
        .replace(/\s*ov$/i,"")
        .trim();
    }
  }


  return "";
}


/* =========================================
   FORMAT SCORE
========================================= */

function formatScore(score){

  if(
    score === null ||
    score === undefined ||
    score === ""
  ){

    return "";
  }


  /*
    STRING SCORE
  */

  if(typeof score === "string"){

    const text =
      score.trim();


    if(!text){
      return "";
    }


    return text;
  }


  /*
    OBJECT SCORE
  */

  if(typeof score === "object"){

    const runs =
      score.r ??
      score.runs ??
      score.score ??
      score.total ??
      score.run ??
      "";


    const wickets =
      score.w ??
      score.wickets ??
      score.wicket ??
      score.wkts ??
      "";


    const overs =
      getOvers(score);


    if(
      runs === "" &&
      wickets === ""
    ){

      return "";
    }


    let result = "";


    if(runs !== ""){
      result += runs;
    }


    if(wickets !== ""){
      result += "/" + wickets;
    }


    if(overs){

      result +=
        " (" +
        overs +
        " ov)";
    }


    return result;
  }


  return String(score);
}


/* =========================================
   GET SCORE TEAM NAME FROM INNING
========================================= */

function getInningTeam(item){

  if(!item || typeof item !== "object"){
    return "";
  }


  return (
    item.team ||
    item.teamName ||
    item.inning ||
    item.innings ||
    item.name ||
    ""
  );
}


/* =========================================
   FIND SCORE FOR TEAM
========================================= */

function findTeamScore(scores,teamName,index){

  if(
    !Array.isArray(scores) ||
    scores.length === 0
  ){

    return null;
  }


  const wanted =
    cleanTeamName(teamName);


  /*
    STEP 1
    Exact / partial team matching
  */

  if(wanted){

    for(const item of scores){

      const inningTeam =
        getInningTeam(item);


      const clean =
        cleanTeamName(inningTeam);


      if(
        clean &&
        (
          clean === wanted ||
          clean.includes(wanted) ||
          wanted.includes(clean)
        )
      ){

        return item;
      }
    }
  }


  /*
    STEP 2
    POSITION BASED FALLBACK

    Very important:
    score[0] = first innings
    score[1] = second innings
  */

  if(scores[index]){

    return scores[index];
  }


  return null;
}


/* =========================================
   GET SCORE ARRAY
========================================= */

function getScoreArray(match){

  if(
    Array.isArray(match.score) &&
    match.score.length
  ){

    return match.score;
  }


  if(
    Array.isArray(match.scores) &&
    match.scores.length
  ){

    return match.scores;
  }


  if(
    Array.isArray(match.innings) &&
    match.innings.length
  ){

    return match.innings;
  }


  if(
    Array.isArray(match.inning) &&
    match.inning.length
  ){

    return match.inning;
  }


  return [];
}


/* =========================================
   GET MATCH SCORES
========================================= */

function getMatchScores(match){

  const teams =
    getTeams(match);


  const team1 =
    teams.team1;


  const team2 =
    teams.team2;


  const scores =
    getScoreArray(match);


  let score1 = null;
  let score2 = null;


  /*
    Direct fields first
  */

  if(match.team1Score !== undefined){
    score1 = match.team1Score;
  }


  if(match.team2Score !== undefined){
    score2 = match.team2Score;
  }


  /*
    SCORE ARRAY
  */

  if(scores.length){

    if(
      score1 === null ||
      score1 === undefined ||
      score1 === ""
    ){

      score1 =
        findTeamScore(
          scores,
          team1,
          0
        );
    }


    if(
      score2 === null ||
      score2 === undefined ||
      score2 === ""
    ){

      score2 =
        findTeamScore(
          scores,
          team2,
          1
        );
    }
  }


  return {
    team1,
    team2,
    score1,
    score2
  };
}


/* =========================================
   PICK LIVE MATCH
========================================= */

function pickMatch(matches){

  if(
    !Array.isArray(matches) ||
    matches.length === 0
  ){

    return null;
  }


  const live =
    matches.find(match => {

      const status =
        String(
          match.status ||
          match.matchStatus ||
          match.state ||
          ""
        ).toLowerCase();


      return (
        status.includes("live") ||
        status.includes("in progress") ||
        status.includes("stumps")
      );

    });


  if(live){
    return live;
  }


  return matches[0];
}


/* =========================================
   RENDER
========================================= */

function renderMatch(match){

  const app =
    document.getElementById("app");


  if(!match){

    app.innerHTML = `
      <div class="scoreboard">
        <div class="no-match">
          No cricket match available
        </div>
      </div>
    `;

    return;
  }


  const scores =
    getMatchScores(match);


  const score1 =
    formatScore(scores.score1);


  const score2 =
    formatScore(scores.score2);


  const status =
    match.status ||
    match.matchStatus ||
    match.state ||
    "LIVE";


  const statusLower =
    String(status).toLowerCase();


  const isLive =
    statusLower.includes("live") ||
    statusLower.includes("in progress") ||
    statusLower.includes("stumps");


  const matchName =
    match.name ||
    match.matchName ||
    match.matchType ||
    "Cricket Match";


  const series =
    match.series ||
    match.seriesName ||
    match.tour ||
    "";


  const venue =
    match.venue ||
    match.venueName ||
    "Venue not available";


  app.innerHTML = `

    <div class="scoreboard">

      <div class="top">

        <div class="brand">
          🏏 CRICKET SHORT
        </div>

        <div class="status ${isLive ? "live" : ""}">
          ${safe(status)}
        </div>

      </div>


      <div class="match-name">
        ${safe(matchName)}
      </div>


      <div class="teams">

        <div class="team">

          <div class="team-name">
            ${safe(scores.team1)}
          </div>

          <div class="score">
            ${safe(score1 || "—")}
          </div>

        </div>


        <div class="vs">
          VS
        </div>


        <div class="team">

          <div class="team-name">
            ${safe(scores.team2)}
          </div>

          <div class="score">
            ${safe(score2 || "—")}
          </div>

        </div>

      </div>


      <div class="info">

        ${safe(series)}

        ${
          series && venue
          ? " • "
          : ""
        }

        ${safe(venue)}

      </div>


      <div class="updated">

        Updated:
        ${new Date().toLocaleTimeString()}

      </div>

    </div>

  `;
}


/* =========================================
   LOAD SCORE
========================================= */

async function loadScore(){

  try{

    const response =
      await fetch(
        API_URL +
        "?nocache=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Cache-Control":"no-cache"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    if(data.success === false){

      throw new Error(
        data.message ||
        "API returned error"
      );
    }


    let matches =
      data.matches ||
      data.data ||
      data.results ||
      [];


    if(!Array.isArray(matches)){

      matches = [];
    }


    const match =
      pickMatch(matches);


    renderMatch(match);


  }catch(error){

    console.error(
      "PRISM SCORE ERROR:",
      error
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="scoreboard">

        <div class="error">

          ⚠️ Live score temporarily unavailable

        </div>

      </div>

    `;
  }

}


/* =========================================
   FIRST LOAD
========================================= */

loadScore();


/* =========================================
   AUTO REFRESH - 5 MINUTES
========================================= */

setInterval(
  loadScore,
  REFRESH_TIME
);


/* =========================================
   PRISM VISIBILITY
========================================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(!document.hidden){

      loadScore();

    }

  }
);

</script>

</body>
</html>
