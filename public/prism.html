<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Cricket Short - PRISM Score</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:transparent !important;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

#app{
  width:100%;
  padding:8px;
  display:flex;
  justify-content:center;
}

.scoreboard{
  width:min(900px,100%);
  background:rgba(3,12,22,.86);
  border:1px solid rgba(100,170,220,.65);
  border-radius:14px;
  padding:10px 12px;
  box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:5px;
}

.brand{
  font-size:11px;
  font-weight:800;
  color:#dcefff;
}

.status{
  font-size:10px;
  font-weight:800;
  padding:4px 8px;
  border-radius:20px;
  background:#45515c;
  color:white;
}

.status.live{
  background:#c51f2d;
}

.status.live::before{
  content:"";
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:white;
  margin-right:4px;
}

.match-name{
  text-align:center;
  color:#a9c1d4;
  font-size:10px;
  margin-bottom:7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.teams{
  display:grid;
  grid-template-columns:1fr 42px 1fr;
  align-items:center;
  gap:6px;
}

.team{
  text-align:center;
  min-width:0;
}

.team-name{
  color:white;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score{
  color:white;
  font-size:22px;
  font-weight:900;
  margin-top:3px;
}

.vs{
  text-align:center;
  color:#7891a5;
  font-size:10px;
  font-weight:800;
}

.info{
  text-align:center;
  margin-top:7px;
  color:#a9c0d1;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.updated{
  text-align:right;
  margin-top:4px;
  color:#70899d;
  font-size:8px;
}

.loading,
.error,
.no-match{
  text-align:center;
  color:white;
  font-size:12px;
  padding:14px;
}

.error{
  color:#ffd1d1;
}

@media(max-width:500px){

  #app{
    padding:5px;
  }

  .scoreboard{
    padding:8px 9px;
    border-radius:11px;
  }

  .team-name{
    font-size:11px;
  }

  .score{
    font-size:18px;
  }

  .match-name{
    font-size:9px;
  }

  .info{
    font-size:9px;
  }

}
</style>
</head>

<body>

<div id="app">
  <div class="scoreboard">
    <div class="loading">Loading live score...</div>
  </div>
</div>

<script>

const API_URL = "/api/live-score";

/* 5 MINUTES */
const REFRESH_TIME = 300000;


/* ================================
   SAFE TEXT
================================ */

function safe(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ================================
   NORMALIZE TEAM NAME
================================ */

function cleanTeamName(name){

  return String(name || "")
    .toLowerCase()
    .replace(/\b(cricket|team)\b/g,"")
    .replace(/[^a-z0-9]/g,"")
    .trim();
}


/* ================================
   GET OVERS
================================ */

function getOvers(score, fallback){

  if(score && typeof score === "object"){

    const values = [
      score.o,
      score.overs,
      score.over,
      score.overCount,
      score.oversCount
    ];

    for(const value of values){

      if(
        value !== undefined &&
        value !== null &&
        String(value).trim() !== ""
      ){

        return String(value)
          .replace(/[()]/g,"")
          .replace(/\s*ov$/i,"")
          .trim();
      }
    }
  }


  if(
    fallback !== undefined &&
    fallback !== null &&
    String(fallback).trim() !== ""
  ){

    return String(fallback)
      .replace(/[()]/g,"")
      .replace(/\s*ov$/i,"")
      .trim();
  }


  return "";
}


/* ================================
   FORMAT SCORE OBJECT
================================ */

function objectScore(score, fallbackOvers){

  if(!score || typeof score !== "object"){
    return "";
  }


  const runs =
    score.r ??
    score.runs ??
    score.score ??
    score.total ??
    score.run ??
    "";


  const wickets =
    score.w ??
    score.wickets ??
    score.wicket ??
    score.wkts ??
    "";


  const overs =
    getOvers(score,fallbackOvers);


  if(
    runs === "" &&
    wickets === "" &&
    !overs
  ){
    return "";
  }


  let result = "";


  if(runs !== ""){
    result += runs;
  }


  if(wickets !== ""){
    result += "/" + wickets;
  }


  if(overs){

    result += " (" + overs + " ov)";
  }


  return result;
}


/* ================================
   FORMAT ANY SCORE
================================ */

function formatScore(score,fallbackOvers){

  if(
    score === null ||
    score === undefined ||
    score === ""
  ){

    return "";
  }


  /* STRING */

  if(typeof score === "string"){

    const text = score.trim();

    if(!text){
      return "";
    }


    /*
      If string already contains overs
    */

    if(/\(\s*[\d.]+\s*ov\s*\)/i.test(text)){
      return text;
    }


    if(fallbackOvers){

      return text +
        " (" +
        fallbackOvers +
        " ov)";
    }


    return text;
  }


  /* OBJECT */

  if(typeof score === "object"){

    return objectScore(
      score,
      fallbackOvers
    );
  }


  return String(score);
}


/* ================================
   GET TEAM SCORE FROM SCORE ARRAY
================================ */

function findScoreForTeam(match,teamName,index){

  const scores = match.score;


  if(!Array.isArray(scores) || scores.length === 0){
    return null;
  }


  const wanted = cleanTeamName(teamName);


  /*
    First try exact/team-name matching
  */

  for(const item of scores){

    if(!item || typeof item !== "object"){
      continue;
    }


    const possibleNames = [
      item.team,
      item.teamName,
      item.inning,
      item.innings,
      item.name
    ];


    for(const name of possibleNames){

      const clean = cleanTeamName(name);


      if(
        clean &&
        wanted &&
        (
          clean === wanted ||
          clean.includes(wanted) ||
          wanted.includes(clean)
        )
      ){

        return item;
      }
    }
  }


  /*
    If API doesn't provide team name,
    use array position.
  */

  return scores[index] || null;
}


/* ================================
   GET MATCH SCORES
================================ */

function getMatchScores(match){

  const team1 =
    match.team1 ||
    match.team1Name ||
    match.teams?.[0] ||
    "Team 1";


  const team2 =
    match.team2 ||
    match.team2Name ||
    match.teams?.[1] ||
    "Team 2";


  let score1 = null;
  let score2 = null;


  let overs1 = "";
  let overs2 = "";


  /*
    DIRECT CUSTOM FIELDS
  */

  if(match.team1Score !== undefined){
    score1 = match.team1Score;
  }


  if(match.team2Score !== undefined){
    score2 = match.team2Score;
  }


  overs1 =
    match.team1Overs ??
    match.team1Over ??
    "";


  overs2 =
    match.team2Overs ??
    match.team2Over ??
    "";


  /*
    SCORE ARRAY
  */

  if(
    Array.isArray(match.score) &&
    match.score.length > 0
  ){

    /*
      Only replace missing scores.
    */

    if(
      score1 === null ||
      score1 === undefined ||
      score1 === ""
    ){

      score1 =
        findScoreForTeam(
          match,
          team1,
          0
        );
    }


    if(
      score2 === null ||
      score2 === undefined ||
      score2 === ""
    ){

      score2 =
        findScoreForTeam(
          match,
          team2,
          1
        );
    }
  }


  /*
    EXTRA FALLBACK:
    some APIs use innings[]
  */

  const innings =
    match.innings ||
    match.inning ||
    match.scores;


  if(Array.isArray(innings)){

    if(
      !score1
    ){

      score1 =
        findScoreFromArray(
          innings,
          team1
        );
    }


    if(
      !score2
    ){

      score2 =
        findScoreFromArray(
          innings,
          team2
        );
    }
  }


  /*
    GET OVERS FROM SCORE OBJECT
  */

  if(
    score1 &&
    typeof score1 === "object"
  ){

    overs1 =
      getOvers(
        score1,
        overs1
      );
  }


  if(
    score2 &&
    typeof score2 === "object"
  ){

    overs2 =
      getOvers(
        score2,
        overs2
      );
  }


  return {
    team1,
    team2,
    score1,
    score2,
    overs1,
    overs2
  };
}


/* ================================
   SEARCH SCORE FROM ARRAY
================================ */

function findScoreFromArray(array,teamName){

  const wanted =
    cleanTeamName(teamName);


  for(const item of array){

    if(!item || typeof item !== "object"){
      continue;
    }


    const names = [
      item.team,
      item.teamName,
      item.inning,
      item.innings,
      item.name
    ];


    for(const name of names){

      const clean =
        cleanTeamName(name);


      if(
        clean &&
        wanted &&
        (
          clean === wanted ||
          clean.includes(wanted) ||
          wanted.includes(clean)
        )
      ){

        return item;
      }
    }
  }


  return null;
}


/* ================================
   PICK LIVE MATCH
================================ */

function pickMatch(matches){

  if(
    !Array.isArray(matches) ||
    matches.length === 0
  ){

    return null;
  }


  const live =
    matches.find(match => {

      const status =
        String(
          match.status ||
          match.matchStatus ||
          match.state ||
          ""
        ).toLowerCase();


      return (
        status.includes("live") ||
        status.includes("stumps") ||
        status.includes("in progress")
      );

    });


  if(live){
    return live;
  }


  const delayed =
    matches.find(match => {

      const status =
        String(
          match.status ||
          match.matchStatus ||
          ""
        ).toLowerCase();


      return status.includes("delay");

    });


  if(delayed){
    return delayed;
  }


  return matches[0];
}


/* ================================
   RENDER
================================ */

function renderMatch(match){

  const app =
    document.getElementById("app");


  if(!match){

    app.innerHTML = `
      <div class="scoreboard">
        <div class="no-match">
          No cricket match available
        </div>
      </div>
    `;

    return;
  }


  const scores =
    getMatchScores(match);


  let score1 =
    formatScore(
      scores.score1,
      scores.overs1
    );


  let score2 =
    formatScore(
      scores.score2,
      scores.overs2
    );


  /*
    IMPORTANT:
    Don't show overs if there is
    no actual score.
  */

  if(
    !score1 &&
    scores.overs1
  ){

    score1 =
      "—";
  }


  if(
    !score2 &&
    scores.overs2
  ){

    score2 =
      "—";
  }


  /*
    If score exists but overs are
    not already inside it.
  */

  if(
    score1 &&
    scores.overs1 &&
    !/\(\s*[\d.]+\s*ov\s*\)/i.test(score1)
  ){

    score1 +=
      " (" +
      safe(scores.overs1) +
      " ov)";
  }


  if(
    score2 &&
    scores.overs2 &&
    !/\(\s*[\d.]+\s*ov\s*\)/i.test(score2)
  ){

    score2 +=
      " (" +
      safe(scores.overs2) +
      " ov)";
  }


  const status =
    match.status ||
    match.matchStatus ||
    match.state ||
    "LIVE";


  const statusLower =
    String(status).toLowerCase();


  const isLive =
    statusLower.includes("live") ||
    statusLower.includes("in progress") ||
    statusLower.includes("stumps");


  const matchName =
    match.name ||
    match.matchName ||
    match.matchType ||
    "Cricket Match";


  const series =
    match.series ||
    match.seriesName ||
    match.tour ||
    "";


  const venue =
    match.venue ||
    match.venueName ||
    "Venue not available";


  app.innerHTML = `

    <div class="scoreboard">

      <div class="top">

        <div class="brand">
          🏏 CRICKET SHORT
        </div>

        <div class="status ${isLive ? "live" : ""}">
          ${safe(status)}
        </div>

      </div>


      <div class="match-name">
        ${safe(matchName)}
      </div>


      <div class="teams">

        <div class="team">

          <div class="team-name">
            ${safe(scores.team1)}
          </div>

          <div class="score">
            ${safe(score1 || "—")}
          </div>

        </div>


        <div class="vs">
          VS
        </div>


        <div class="team">

          <div class="team-name">
            ${safe(scores.team2)}
          </div>

          <div class="score">
            ${safe(score2 || "—")}
          </div>

        </div>

      </div>


      <div class="info">

        ${safe(series)}

        ${
          series && venue
          ? " • "
          : ""
        }

        ${safe(venue)}

      </div>


      <div class="updated">

        Updated:
        ${new Date().toLocaleTimeString()}

      </div>

    </div>

  `;
}


/* ================================
   LOAD SCORE
================================ */

async function loadScore(){

  try{

    const response =
      await fetch(
        API_URL +
        "?nocache=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Cache-Control":"no-cache"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    if(data.success === false){

      throw new Error(
        data.message ||
        "API returned error"
      );
    }


    let matches =
      data.matches ||
      data.data ||
      data.results ||
      [];


    if(!Array.isArray(matches)){

      matches = [];
    }


    const match =
      pickMatch(matches);


    renderMatch(match);


  }catch(error){

    console.error(
      "PRISM SCORE ERROR:",
      error
    );


    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="scoreboard">

        <div class="error">

          ⚠️ Live score temporarily unavailable

        </div>

      </div>

    `;
  }

}


/* ================================
   FIRST LOAD
================================ */

loadScore();


/* ================================
   EVERY 5 MINUTES
================================ */

setInterval(
  loadScore,
  REFRESH_TIME
);


/* ================================
   WHEN PRISM BECOMES VISIBLE
================================ */

document.addEventListener(
  "visibilitychange",
  function(){

    if(!document.hidden){

      loadScore();

    }

  }
);

</script>

</body>
</html>
